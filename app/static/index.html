<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>宿修 · 宿舍报修协作</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/controller.js"></script></head>
<body><div id="toast" role="status" aria-live="polite"></div>
<section id="auth" class="auth"><div class="intro"><span class="wordmark">宿修 <small>DORM CARE</small></span><p class="eyebrow">把宿舍里的小问题，认真解决。</p><h1>从一张报修单，<br>到安心的每一天。</h1><p>记录问题、安排维修、跟踪进度。<br>每一次处理，都有清楚的回应。</p><div class="intro-footer">提交 · 处理 · 验收 <span>校园宿舍服务</span></div></div>
<form id="auth-form" class="auth-form"><p class="eyebrow">欢迎使用宿修</p><h2 id="auth-title">登录你的账号</h2><p class="muted">查看报修进度，继续处理待办。</p><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="40"></label><label>密码<input name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="64"><small>至少10位，同时包含字母和数字</small></label><div id="register-fields" hidden><label>邮箱（选填）<input name="email" type="email" maxlength="120"></label><label>身份<select name="role"><option value="student">学生</option><option value="technician">维修人员</option><option value="admin">管理员</option></select></label><label>邀请码（维修人员与管理员必填）<input name="invite_code" autocomplete="off"></label></div><button class="primary" id="auth-submit">登录</button><button type="button" id="auth-toggle" class="text">还没有账号？注册</button><p id="auth-error" role="alert" class="error"></p></form></section>
<div id="shell" class="shell" hidden><aside><a class="wordmark" href="/">宿修 <small>DORM CARE</small></a><p class="nav-caption">工作空间</p><nav id="nav"></nav><div class="sidebar-bottom"><div id="identity"></div><button id="logout" class="text">退出登录</button></div></aside><main><header><div><p id="role-caption" class="eyebrow"></p><h1 id="page-title"></h1></div><span class="live"><i></i><span id="live-status">正在连接</span></span></header><div id="content"></div></main></div>
<dialog id="detail"><div class="dialog-top"><h2>工单详情</h2><button id="close-detail" class="ghost" aria-label="关闭详情">关闭</button></div><div id="detail-content"></div></dialog>
</body></html>
